{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-dark text-center py-4">
                <h2 class="mb-0 text-gradient fw-bold">
                    <i class="bi bi-lightning-charge me-2"></i>Вход
                </h2>
            </div>
            <div class="card-body p-4 p-md-5">
                <form method="post">
                    {% csrf_token %}

                    {% if form.errors %}
                    <div class="alert alert-danger">
                        <strong>Ошибка!</strong> Неверное имя пользователя или пароль.
                    </div>
                    {% endif %}

                    <div class="mb-4">
                        <label class="form-label fw-bold text-primary">Имя пользователя</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-primary">Пароль</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Войти
                        </button>
                    </div>
                </form>

                <hr class="my-4 border-gray">

                <div class="text-center">
                    <p class="mb-2 text-muted">Нет аккаунта?</p>
                    <a href="{% url 'register' %}" class="btn btn-outline-primary">
                        <i class="bi bi-person-plus me-2"></i>Зарегистрироваться
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
